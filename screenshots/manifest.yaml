# Screenshot manifest. Each entry produces one image per theme.
#
#   output:    image path relative to the repo root. `{theme}` becomes light or dark.
#   url:       path on the fixture site (screenshots/fixture), served by `mint dev`.
#   themes:    [light, dark] by default.
#   viewport:  CSS pixels. Images are captured at 2x.
#   hide:      CSS selectors to hide before capture, to remove visual noise.
#   steps:     actions to run before capture: click, hover, type, press, wait.
#   crop:      omit to capture the whole viewport. Otherwise, a list of selectors;
#              the image is cropped to the box around all of them, plus `padding`.
#
# Run `npm run capture` to regenerate every image, or `npm run capture -- <output>`
# to regenerate one.

defaults:
  themes: [light, dark]
  viewport: { width: 1316, height: 751 }
  hide:
    - "[data-assistant-bar]" # Floating "Ask a question" bar
    - "#chat-assistant-sheet"

shots:
  - output: images/changelog-toc-{theme}.png
    url: /product-updates
    hide:
      - "#pagination"
      - "#footer"

  - output: images/changelog-filters-{theme}.png
    url: /changelog?tags=Peppermint
    crop:
      selectors: ["#header", "#content", "#changelog-filters"]
      padding: 16

  - output: images/changelog-rss-button-{theme}.png
    url: /product-updates
    crop:
      selectors: ["#header"]
      padding: 20 # More than 24 reaches the navbar border.
