extends: existence
message: "Remove '%s'. Chat tools add this when you copy text or links out of them."
link: https://github.com/mintlify/docs/blob/main/style-guide/voice-and-tone.md
level: error
ignorecase: true
scope: raw
nonword: true
tokens:
  # Citation markup left over from chat interfaces
  - 'contentReference\[oaicite:\d+\]'
  - 'oai_citation'
  - 'cite(?:turn\d+(?:search|news|view)\d+)+'
  # Tracking parameters chat tools append to generated links
  - 'utm_source=(?:chatgpt\.com|openai|copilot\.com|claude\.ai|perplexity\.ai)'
