extends: substitution
message: "Use '%s' instead of '%s'."
link: https://github.com/mintlify/docs/blob/main/style-guide/word-list.md
level: warning
ignorecase: false
vocab: false
action:
  name: replace
swap:
  "(?:Web|web) Editor": editor
  "[Ff]ront[- ]matter": frontmatter
  API Playground: API playground
  MCP Server: MCP server
  Open API: OpenAPI
  chatbot: assistant
  '(?<!"\w+ )(?<=[a-z,] )Dashboard': dashboard
  "log in(?:to)?": sign in|sign in to
  logged in: signed in
  logging in: signing in
  "[Ll]ogged-out": signed-out
  "(?:Growth|Hobby) plan": Starter, Pro, or Enterprise plan
  "preview links?": preview deployment
  bool: boolean
  "LLMs\\.txt": llms.txt
