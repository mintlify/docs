extends: existence
message: "Cut or rephrase '%s'. See 'Phrases to cut' in the style guide."
link: https://github.com/mintlify/docs/blob/main/style-guide/voice-and-tone.md
level: suggestion
ignorecase: true
tokens:
  # Promotional
  - seamless(?:ly)?
  - breathtaking
  - captivat(?:e|es|ing)
  - rich heritage
  - stands as a testament
  - plays an? (?:vital|crucial|key|pivotal) role
  - powerful
  # Editorializing
  - it(?:'s| is) important to note
  - it(?:'s| is) worth noting
  - this (?:article|page|guide) will
  - in conclusion
  - needless to say
  # Filler transitions
  - moreover
  - furthermore
  - additionally
  # Vague attribution
  - experts (?:say|agree|argue)
  - industry reports suggest
