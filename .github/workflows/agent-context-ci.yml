name: Validate agent context

on:
  pull_request:
    paths:
      - agent-context/**
      - skill.md
      - cli/commands.mdx
      - .github/workflows/agent-context-ci.yml
      - .github/workflows/sync-agent-context.yml
  push:
    branches: [main]
    paths:
      - agent-context/**
      - skill.md
      - cli/commands.mdx
      - .github/workflows/agent-context-ci.yml
      - .github/workflows/sync-agent-context.yml
  # CLI instruction topics link to docs pages; a nightly run catches pages renamed or deleted elsewhere.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
        working-directory: agent-context
      - run: npm test
        working-directory: agent-context
      - run: npm run check
        working-directory: agent-context
      - run: npm run build
        working-directory: agent-context
