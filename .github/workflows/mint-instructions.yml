name: Check mint instructions

on:
  pull_request:
    paths:
      - mint-instructions/**
      - docs.json
      - .github/scripts/check-mint-instructions.mjs
      - .github/workflows/mint-instructions.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - run: node .github/scripts/check-mint-instructions.mjs
