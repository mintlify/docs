name: Check setup prompt sync

on:
  pull_request:
    paths:
      - snippets/setup-agent-prompt.mdx
      - snippets/setup-agent-prompt-text.mdx
      - .github/scripts/check-prompt-sync.mjs
      - .github/workflows/check-prompt-sync.yml

permissions:
  contents: read

jobs:
  check:
    name: Check setup prompt sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node .github/scripts/check-prompt-sync.mjs
